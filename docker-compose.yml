services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bita
      POSTGRES_USER: bita
      POSTGRES_PASSWORD: bita_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bita -d bita"]
      interval: 5s
      timeout: 5s
      retries: 5

  test_db:
    image: postgres:17
    environment:
      POSTGRES_DB: bita_test
      POSTGRES_USER: bita
      POSTGRES_PASSWORD: bita_test_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bita -d bita_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: